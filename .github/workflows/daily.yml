name: Daily paper trading

on:
  schedule:
    # GitHub runs scheduled jobs "best effort": they can start hours late or be
    # skipped under load. Runs are idempotent (a session is recorded once), so
    # several attempts per trading day are safe; whichever runs first records it.
    # Times are UTC, Tuesday-Saturday = after each Monday-Friday session.
    # New York times below are winter (EST); add one hour in summer (EDT).
    - cron: "30 4 * * 2-6"  # 23:30 ET: main run. Yahoo's bar is often still empty around 20:30.
    - cron: "30 11 * * 2-6" # 06:30 ET: backup
    - cron: "15 12 * * 2-6" # 07:15 ET: backup, before the 08:30 check in Muse
  workflow_dispatch: {} # "Run workflow" button for manual runs

permissions:
  contents: write # commit the new report back to the repo

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Run paper trading
        id: paper
        run: python scripts/paper.py
        continue-on-error: true # still commit a DATA ERROR status so Muse shows it

      - name: Commit results
        run: |
          git config user.name "stockpilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/config.json paper/ledger paper/orders_log.csv paper/reports muse/data data/universe
          if git diff --cached --quiet; then
            echo "No new data today."
          else
            git commit -m "Paper trading report $(date -u +%Y-%m-%d)"
            git pull --rebase # someone may have pushed code since this run started
            git push
          fi

      - name: Fail the run if paper trading reported a data error or crashed
        if: steps.paper.outcome == 'failure'
        run: |
          echo "scripts/paper.py failed or reported DATA ERROR; see the report committed above."
          exit 1
