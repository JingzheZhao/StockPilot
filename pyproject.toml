[project]
name = "stockpilot"
version = "0.1.0"
description = "Personal rule-based US stock trading agent: backtest first."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "matplotlib>=3.7",
    "tabulate>=0.9",
    "tzdata",  # time-zone database; Windows has none built in
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["stockpilot*"]  # other top-level folders (muse, paper, data) are not code packages

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
